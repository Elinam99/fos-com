<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Geoffrey — Portfolio | Fos.com</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,700;1,500;1,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="portfolio.css">
	<link rel="stylesheet" href="translate.css">
	<script src="https://kit.fontawesome.com/b5b26585e9.js" crossorigin="anonymous"></script>
</head>
<body class="portfolio-page">
	<div class="portfolio-glow portfolio-glow--accent" aria-hidden="true"></div>
	<div class="portfolio-glow portfolio-glow--hero" aria-hidden="true"></div>
	<div class="portfolio-glow portfolio-glow--muted" aria-hidden="true"></div>

	<div class="portfolio-header-bar">
	<header class="portfolio-header">
		<nav class="portfolio-nav">
			<a href="projects.html" class="portfolio-header-btn">Projects</a>
		</nav>
		<div class="portfolio-header-actions">
			<a href="founders/Resume.pdf" class="portfolio-header-btn" id="resume_download_btn" download="Geoffrey-Resume.pdf">
				Resume
				<i class="fa-solid fa-download"></i>
			</a>
			<button type="button" class="portfolio-theme-btn" id="theme_toggle" aria-label="Toggle dark mode">
				<span class="portfolio-theme-glyph portfolio-theme-glyph--dark" aria-hidden="true">☾</span>
				<span class="portfolio-theme-glyph portfolio-theme-glyph--light" aria-hidden="true">☀</span>
			</button>
		</div>
	</header>
	</div>

	<main class="portfolio-hero">
		<div class="portfolio-hero-layout">
			<div class="portfolio-hero-copy">
				<span class="portfolio-availability">
					<span class="portfolio-availability-dot" aria-hidden="true"></span>
					Available for new opportunities
				</span>
				<p class="portfolio-greeting">Hi I'm Geoffrey</p>
				<h1 class="portfolio-role">Fos.com Designer</h1>
				<p class="portfolio-tagline">
					Building Ghana's fashion digital marketplace.
				</p>
			</div>

			<div class="portfolio-visual">
				<div class="portfolio-hero-glow" aria-hidden="true"></div>
				<div class="portfolio-slider-wrap">
				<div class="portfolio-arch-frame">
					<div class="portfolio-slider" id="portfolio_slider">
						<div class="portfolio-slide">
							<img
								src="founders/Founder Geoffrey.JPG"
								alt="Founder Geoffrey"
								width="680"
								height="760"
								loading="eager"
								decoding="async">
						</div>
						<div class="portfolio-slide">
							<img
								src="founders/Founder Geoffrey 2.jpg"
								alt="Founder Geoffrey"
								width="680"
								height="760"
								loading="lazy"
								decoding="async">
						</div>
					</div>
				</div>
			</div>
			</div>
		</div>
	</main>

	<a href="Contact.html" class="portfolio-get-in-touch">
		<span class="portfolio-get-in-touch-arrow" aria-hidden="true">→</span>
		Get in Touch
	</a>

	<footer class="portfolio-footer">
		<p>&copy; 2024 Geoffrey — Fos.com</p>
	</footer>

	<script>
		const themeToggle = document.getElementById('theme_toggle');
		const themeGlyphDark = document.querySelector('.portfolio-theme-glyph--dark');
		const themeGlyphLight = document.querySelector('.portfolio-theme-glyph--light');

		function setTheme(isDark) {
			document.body.classList.toggle('dark-mode', isDark);
			if (themeGlyphDark) themeGlyphDark.hidden = isDark;
			if (themeGlyphLight) themeGlyphLight.hidden = !isDark;
			localStorage.setItem('fos-theme', isDark ? 'dark' : 'light');
		}

		if (themeToggle) {
			themeToggle.addEventListener('click', () => {
				setTheme(!document.body.classList.contains('dark-mode'));
			});
		}

		if (localStorage.getItem('fos-theme') === 'dark') {
			setTheme(true);
		} else {
			setTheme(false);
		}

		const resumeDownloadBtn = document.getElementById('resume_download_btn');
		resumeDownloadBtn?.addEventListener('click', (e) => {
			e.preventDefault();
			if (!confirm('Do you want to download the resume?')) return;
			const link = document.createElement('a');
			link.href = resumeDownloadBtn.getAttribute('href');
			link.download = resumeDownloadBtn.getAttribute('download') || 'Geoffrey-Resume.pdf';
			document.body.appendChild(link);
			link.click();
			link.remove();
		});

		const portfolioSlider = document.getElementById('portfolio_slider');
		const slides = portfolioSlider?.querySelectorAll('.portfolio-slide');

		if (portfolioSlider && slides && slides.length > 1) {
			let currentSlide = 0;
			const slideCount = slides.length;

			function goToSlide(index) {
				currentSlide = (index + slideCount) % slideCount;
				portfolioSlider.style.transform = 'translateX(-' + (currentSlide * (100 / slideCount)) + '%)';
			}

			setInterval(() => goToSlide(currentSlide + 1), 5000);
		}
	</script>
	<div id="google_translate_element" aria-hidden="true"></div>
	<script src="translate.js"></script>
	<script src="https://translate.google.com/translate_element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
